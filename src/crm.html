<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pandey Realty CRM</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Pandey Realty CRM: white + black + gold, phone first. */
:root{--bg:#fff;--soft:#f7f6f2;--line:#e7e2d7;--fg:#111;--muted:#666;--gold:#c9a45a;--gold-ink:#86662a;--gold-soft:#f6eedd;--ok:#2f7a4d;--ok-soft:#e6f2ea;--err:#b23b3b;--err-soft:#f8e6e6;--warn:#9a5b00;--warn-soft:#fbefdc;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0;line-height:1.15}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* buttons + inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;border:1px solid var(--fg);background:var(--fg);color:#fff;font-weight:600;padding:10px 18px;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:42px}
.btn:hover{filter:brightness(1.25)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111}
.btn.ghost{background:#fff;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold);filter:none}
.btn.danger{background:#fff;color:var(--err);border-color:#e9c9c9}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;cursor:pointer;text-decoration:none;flex:none}
.icon-btn:hover{border-color:var(--gold)}
.icon-btn svg,.btn svg{width:18px;height:18px}
label.f{display:grid;gap:5px;font-size:14px;font-weight:600}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=datetime-local],input[type=search],select,textarea{width:100%;font-size:16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
textarea{min-height:90px;resize:vertical}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--gold);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;background:#fff}
.chips input:checked+span{background:var(--fg);border-color:var(--fg);color:#fff}
.chips input:focus-visible+span{outline:3px solid var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:3px 9px;background:var(--soft);color:#333;white-space:nowrap}
.pill.new{background:var(--gold);color:#111}
.pill.hot{background:var(--err-soft);color:var(--err)}
.pill.warm{background:var(--warn-soft);color:var(--warn)}
.pill.cold{background:#e9eef3;color:#3d4a57}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.late{background:var(--err-soft);color:var(--err)}
.pill.pool{background:#111;color:#fff}

/* login */
.auth{min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#fff, var(--soft))}
.auth form{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 26px;display:grid;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.06)}
.auth img{width:150px;justify-self:center}
.auth h1{font-size:24px;text-align:center}
.auth p{margin:0;color:var(--muted);text-align:center;font-size:14.5px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--gold-ink);font-weight:600;font-size:13.5px;cursor:pointer;padding:6px}
.msg{font-size:14px;border-radius:10px;padding:10px 12px}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}

/* shell */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .in{display:flex;align-items:center;gap:12px;height:60px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.top .brand img{width:52px;height:auto}
.top .brand b{font-family:var(--display);font-size:17px}
.top .brand small{display:block;font-size:12px;color:var(--gold-ink);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.who{font-size:14px;color:var(--muted);text-align:right;line-height:1.2}
.who b{display:block;color:var(--fg)}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100svh - 61px)}
.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:61px;height:calc(100svh - 61px)}
.side a{display:flex;align-items:center;gap:10px;text-decoration:none;padding:10px 12px;border-radius:10px;font-weight:600;color:#333}
.side a svg{width:19px;height:19px;color:var(--gold-ink)}
.side a:hover{background:var(--soft)}
.side a.on{background:var(--fg);color:#fff}.side a.on svg{color:var(--gold)}
.side .count{margin-left:auto;font-size:12px;background:var(--gold);color:#111;border-radius:999px;padding:1px 7px}
main{padding:24px clamp(16px,3vw,36px) 120px;max-width:1240px;width:100%;min-width:0}
.tabbar{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}.side{display:none}
  .who{display:none}
  main{padding:18px 14px calc(110px + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:grid;justify-items:center;gap:2px;text-decoration:none;font-size:11.5px;font-weight:600;color:#555;padding:4px 0;position:relative}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a.on{color:#111}.tabbar a.on svg{color:var(--gold-ink)}
  .tabbar .count{position:absolute;top:0;left:calc(50% + 6px);font-size:10.5px;background:var(--gold);color:#111;border-radius:999px;padding:0 5px}
}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));z-index:26;width:58px;height:58px;border-radius:999px;background:var(--gold);border:0;box-shadow:0 10px 26px rgba(0,0,0,.18);display:grid;place-items:center;cursor:pointer}
.fab svg{width:26px;height:26px}
@media (max-width:860px){.fab{bottom:calc(84px + env(safe-area-inset-bottom))}}

/* page parts */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:clamp(26px,4vw,34px)}
.ph p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.card>h2,.card .ch h2{font-size:18px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;display:block;background:#fff}
.stat:hover{border-color:var(--gold)}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1.1}
.stat span{font-size:13.5px;color:var(--muted)}
.stat.alert b{color:var(--err)}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:1fr}}
.empty{color:var(--muted);font-size:14.5px;padding:10px 0}
.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);text-decoration:none;min-width:0}
.list>.row:first-child{border-top:0}
.row .main{min-width:0;flex:1}
.row .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side-info{display:flex;align-items:center;gap:8px;flex:none}
a.row:hover b{text-decoration:underline;text-decoration-color:var(--gold)}
.tick{width:24px;height:24px;accent-color:var(--gold);flex:none;cursor:pointer}
@media (max-width:600px){.row .main b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.edit-ico{display:none!important}.row .side-info .select-inline{max-width:140px}}
.task-done .main b{text-decoration:line-through;color:var(--muted)}
.av{width:36px;height:36px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-weight:700;font-size:13.5px;flex:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0}
.toolbar select{width:auto;flex:0 1 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:#fff;flex-wrap:wrap}
.seg a,.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:#444;white-space:nowrap}
.seg .on{background:var(--fg);color:#fff}
.seg .n{font-size:12px;opacity:.75;margin-left:3px}
.select-inline{width:auto;min-height:34px;padding:4px 30px 4px 10px;font-size:14px;border-radius:999px}

/* contact page */
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px;margin-bottom:10px}
.hero{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.hero h1{font-size:clamp(26px,4.4vw,38px)}
.hero .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.cgrid>div{display:grid;gap:16px;min-width:0}
@media (max-width:980px){.cgrid{display:flex;flex-direction:column}.cgrid>div{display:contents}.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}}
dl.info{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:0;font-size:15px}
dl.info dt{color:var(--muted)}
dl.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.deal{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.deal+.deal{margin-top:10px}
.deal .dt{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.deal .dt b{font-size:15.5px}
.deal .facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:#444}
.composer{display:grid;gap:10px}
.composer .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.timeline{display:grid;gap:0;margin-top:6px}
.ev{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.ev .ico{width:30px;height:30px;border-radius:999px;background:var(--soft);display:grid;place-items:center}
.ev .ico svg{width:15px;height:15px;color:var(--gold-ink)}
.ev .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.ev .h b{color:var(--fg);font-size:14px}
.ev p{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.ev .del{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px}

/* pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory;overscroll-behavior-x:contain}
@media (max-width:860px){.board{grid-auto-columns:82vw}}
.colm{background:var(--soft);border-radius:14px;padding:10px;scroll-snap-align:start;min-height:200px;display:flex;flex-direction:column;gap:8px}
.colm.drop{outline:2px dashed var(--gold);outline-offset:-2px}
.colm header{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 4px 6px}
.colm header b{font-size:14.5px}
.colm header small{color:var(--muted);font-size:12.5px;text-align:right}
.dcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;cursor:grab}
.dcard:hover{border-color:var(--gold)}
.dcard a{text-decoration:none;font-weight:700}
.dcard small{color:var(--muted);font-size:13px;display:block}
.dcard .ft{display:flex;justify-content:space-between;align-items:center;gap:6px}

/* sheet (modal) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:grid;place-items:center;padding:20px}
.sheet{background:#fff;border-radius:18px;width:min(620px,100%);max-height:min(88svh,900px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet header h2{font-size:20px}
.sheet .body{padding:18px 20px;overflow:auto;display:grid;gap:14px;-webkit-overflow-scrolling:touch}
.sheet footer{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet footer .left{margin-right:auto}
@media (max-width:640px){.scrim{place-items:end stretch;padding:0}.sheet{border-radius:18px 18px 0 0;width:100%;max-height:94svh}}
.menu{display:grid;gap:8px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-weight:600;cursor:pointer}
.menu button:hover{border-color:var(--gold)}
.menu button svg{width:20px;height:20px;color:var(--gold-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:60;background:#111;color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.err{background:var(--err)}
@media (max-width:860px){.toast{bottom:calc(90px + env(safe-area-inset-bottom))}}
.loading{min-height:60svh;display:grid;place-items:center;color:var(--muted)}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>window.__TEAM = {{CRM_TEAM}};</script>
<script>
(() => {
"use strict";
// ---------- tiny helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (n) => (n == null || n === "" ? "" : "$" + Math.round(Number(n)).toLocaleString("en-US"));
const short$ = (n) => { n = Number(n) || 0; return n >= 1e6 ? "$" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M" : n >= 1e3 ? "$" + Math.round(n / 1e3) + "K" : n ? "$" + n : "$0"; };
const initials = (name) => String(name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
const telHref = (p) => "tel:" + String(p || "").replace(/[^\d+]/g, "");
const smsHref = (p) => "sms:" + String(p || "").replace(/[^\d+]/g, "");
const dayStart = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };

function when(iso, withTime = true) {
  if (!iso) return "";
  const d = parseDay(iso), diff = Math.round((dayStart(d) - dayStart(new Date())) / 864e5);
  const time = withTime && iso.length > 10 ? " " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
  if (diff === 0) return "Today" + time;
  if (diff === 1) return "Tomorrow" + time;
  if (diff === -1) return "Yesterday" + time;
  if (diff > 1 && diff < 7) return d.toLocaleDateString([], { weekday: "long" }) + time;
  return d.toLocaleDateString([], { month: "short", day: "numeric", year: d.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined }) + time;
}
const ago = (iso) => { if (!iso) return ""; const m = Math.round((Date.now() - new Date(iso)) / 6e4); if (m < 1) return "just now"; if (m < 60) return m + " min ago"; const h = Math.round(m / 60); if (h < 24) return h + " hr ago"; return when(iso, false); };
const toLocalInput = (iso) => { if (!iso) return ""; const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const inDays = (n, hour = 10) => { const d = new Date(); d.setDate(d.getDate() + n); d.setHours(hour, 0, 0, 0); return d.toISOString(); };
const I = {
  today: '<path d="M3 10h18M7 3v4M17 3v4M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/>',
  people: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  pipe: '<path d="M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v6h-4z"/>',
  check: '<path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  team: '<path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/>',
  user: '<path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/>',
  more: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',

// ---------- state + server ----------
const S = { data: null, authed: null, sheet: null };
let toastTimer;
function toast(msg, kind = "") { const t = $("#toast"); t.textContent = msg; t.className = "toast " + kind; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 3200); }
async function api(a, body = {}) {
  const r = await fetch("/api/crm", { method: "POST", headers: { "Content-Type": "application/json", "X-CRM": "1" }, credentials: "same-origin", body: JSON.stringify({ a, ...body }) });
  const j = await r.json().catch(() => ({ ok: false, error: "No response from the server." }));
  if (r.status === 401 && a !== "login") { S.data = null; S.authed = false; render(); }
  if (!j.ok) throw new Error(j.error || "Something went wrong.");
  if (j.me) S.data = j;
  return j;
}
async function load(quiet) {
  try {
    const r = await fetch("/api/crm?a=data", { credentials: "same-origin", cache: "no-store" });
    if (r.status === 401) { S.data = null; S.authed = false; return render(); }
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    S.data = j; S.authed = true;
    if (!(quiet && S.sheet)) render();
  } catch (e) { if (!quiet) { $("#app").innerHTML = `<div class="loading">Couldn't load the CRM. <button class="btn ghost sm" onclick="location.reload()">Try again</button></div>`; } }
}
// Keep data fresh: on focus and every minute while open.
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.authed) load(true); });
setInterval(() => { if (!document.hidden && S.authed && !S.sheet && !document.activeElement.closest?.("form")) load(true); }, 60000);

const openTasks = () => D().tasks.filter((t) => !t.done);

const bucket = (t) => { const d = dayStart(new Date(t.due)), td = dayStart(new Date()); return d < td ? "overdue" : +d === +td ? "today" : "upcoming"; };
const mineFilter = (t) => !isManager() || S.owner === "all" || !S.owner ? true : t.assignedTo === S.owner;
const dealAmount = (d) => (cfg().DEAL_TYPES[d.type]?.group === "Mortgage" ? d.loanAmount ?? d.price : d.price ?? d.loanAmount);
const boardOf = (type) => (cfg().DEAL_TYPES[type]?.group === "Mortgage" ? "Loans" : type);

const tempPill = (t) => (t ? `<span class="pill ${t.toLowerCase()}">${esc(t)}</span>` : "");

const route = () => { const [v, ...rest] = location.hash.replace(/^#\/?/, "").split("/"); return { view: v || "today", arg: decodeURIComponent(rest.join("/") || "") }; };
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

function render() {
  const app = $("#app");

  if (me().mustChange) { app.innerHTML = changePwView(true); return; }

}

// ---------- today ----------

function todayView() {

  const deals = D().deals.filter((d) => !finished(d));
  const soon = deals.filter((d) => d.closeDate && (parseDay(d.closeDate) - dayStart(new Date())) / 864e5 <= 30 && (parseDay(d.closeDate) - dayStart(new Date())) >= 0).sort((a, b) => a.closeDate.localeCompare(b.closeDate));

      <div class="quick"><button class="btn gold" data-act="new-contact">${ico("plus")} New contact</button><button class="btn ghost" data-act="new-task">${ico("check")} New follow-up</button></div></div>

      ${soon.length || locks.length ? `<section class="card"><div class="ch"><h2>Closings & rate locks</h2></div><div class="list">${locks.map((d) => dealLine(d, "lock", d.lockExp)).join("")}${soon.map((d) => dealLine(d, "close", d.closeDate)).join("")}</div></section>` : ""}
    </div>`;
}

// ---------- contacts ----------
function contactsView() {
  const q = (S.q || "").toLowerCase().trim(), st = S.status || "", ty = S.type || "";
  let list = D().contacts.filter((c) => (!st || (st === "open" ? !["Closed", "Not interested"].includes(c.status) : c.status === st)) && (!ty || (c.types || []).includes(ty)) && (c.pool || ownedBy(c)));
  if (q) { const qd = q.replace(/\D/g, ""); list = list.filter((c) => [c.name, c.email, c.address, c.city, c.tags, c.sourceDetail].join(" ").toLowerCase().includes(q) || (qd.length >= 3 && String(c.phone || "").replace(/\D/g, "").includes(qd))); }
  const sort = S.sort || "recent";
  list.sort(sort === "name" ? (a, b) => a.name.localeCompare(b.name) : sort === "next" ? (a, b) => ((nextTask(a.id)?.due || "9") > (nextTask(b.id)?.due || "9") ? 1 : -1) : (a, b) => (b.updatedAt || b.createdAt).localeCompare(a.updatedAt || a.createdAt));
  const opt = (v, cur, label = v) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(label)}</option>`;
  return `<div class="ph"><div><h1>Contacts</h1><p>${list.length} ${list.length === 1 ? "person" : "people"}</p></div>
      <div class="quick">${isBroker() ? `<button class="btn ghost" data-act="export">${ico("download")} Export</button>` : ""}<button class="btn gold" data-act="new-contact">${ico("plus")} New contact</button></div></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search name, phone, email, address" value="${esc(S.q || "")}" data-input="q" aria-label="Search contacts">
      <select class="select-inline" data-change="status" aria-label="Status">${opt("", st, "Any status")}${opt("open", st, "Open (not closed)")}${cfg().STATUSES.map((s) => opt(s, st)).join("")}</select>
      <select class="select-inline" data-change="type" aria-label="Type">${opt("", ty, "Any type")}${cfg().CONTACT_TYPES.map((s) => opt(s, ty)).join("")}</select>
      ${ownerSelect()}
      <select class="select-inline" data-change="sort" aria-label="Sort">${opt("recent", sort, "Recently updated")}${opt("name", sort, "Name A–Z")}${opt("next", sort, "Next follow-up")}</select>
    </div>
    <div class="card" style="padding:4px 16px"><div class="list">
    ${list.map((c) => {
      if (c.pool) return leadRow(c);
      const nt = nextTask(c.id);
      return `<a class="row" href="#contact/${c.id}"><span class="av">${esc(initials(c.name))}</span>
        <div class="main"><b>${esc(c.name)}</b><small>${esc([(c.types || []).join(", "), c.phone, isManager() ? userName(c.assignedTo) : ""].filter(Boolean).join(" · "))}</small></div>
        <div class="side-info">${nt ? `<span class="pill ${bucket(nt) === "overdue" ? "late" : ""}">${esc(when(nt.due, false))}</span>` : ""}${tempPill(c.temp)}${statusPill(c.status)}</div></a>`;
    }).join("") || `<div class="empty">No contacts match. <button class="btn ghost sm" data-act="clear-filters">Clear filters</button></div>`}
    </div></div>`;
}

// ---------- one contact ----------
const kindIcon = { Note: "note", Call: "phone", Text: "text", Email: "mail", Meeting: "people", System: "bolt" };
function contactView(id) {
  const c = contactById(id);
  if (!c) return `<a class="back" href="#contacts">${ico("back")} Contacts</a><div class="card empty">This contact isn't available. It may have been reassigned or deleted.</div>`;
  if (c.pool) return `<a class="back" href="#contacts">${ico("back")} Contacts</a><div class="card"><h2>${esc(c.name)}</h2><p>This lead is in the shared pool. Take it to see the details and start working it.</p><button class="btn" data-act="claim" data-id="${c.id}">Take this lead</button></div>`;
  const deals = D().deals.filter((d) => d.contactId === c.id).sort((a, b) => finished(a) - finished(b) || b.createdAt.localeCompare(a.createdAt));
  const tasks = D().tasks.filter((t) => t.contactId === c.id);
  const open = tasks.filter((t) => !t.done).sort((a, b) => a.due.localeCompare(b.due));
  const done = tasks.filter((t) => t.done).sort((a, b) => (b.doneAt || "").localeCompare(a.doneAt || ""));

function boards() { const t = Object.keys(cfg().DEAL_TYPES); return [...t.filter((x) => cfg().DEAL_TYPES[x].group !== "Mortgage"), "Loans"]; }
function pipelineView(arg) {
  const all = boards(), board = all.includes(arg) ? arg : S.board && all.includes(S.board) ? S.board : "Buy";
  S.board = board;
  const types = board === "Loans" ? Object.keys(cfg().DEAL_TYPES).filter((x) => cfg().DEAL_TYPES[x].group === "Mortgage") : [board];
  const stages = cfg().DEAL_TYPES[types[0]].stages.filter((s) => S.showLost || !cfg().LOST.includes(s));
  const deals = D().deals.filter((d) => types.includes(d.type) && (!isManager() || (S.owner || "all") === "all" || (S.owner === "none" ? !d.agentId && !d.loId : d.agentId === S.owner || d.loId === S.owner)));
  const counts = Object.fromEntries(all.map((b) => [b, D().deals.filter((d) => boardOf(d.type) === b && !finished(d)).length]));
  return `<div class="ph"><div><h1>Pipeline</h1><p>Move a deal by changing its stage${matchMedia("(pointer:fine)").matches ? " or dragging the card" : ""}.</p></div>
      <div class="quick"><button class="btn gold" data-act="new-deal">${ico("plus")} New deal</button></div></div>
    <div class="toolbar"><div class="seg" role="tablist">${all.map((b) => `<a href="#pipeline/${encodeURIComponent(b)}" class="${b === board ? "on" : ""}" role="tab" aria-selected="${b === board}">${esc(b === "Lease / rent" ? "Lease" : b)}<span class="n">${counts[b] || ""}</span></a>`).join("")}</div>
      ${ownerSelect()}<label class="chk" style="font-size:14px"><input type="checkbox" data-change="showLost" ${S.showLost ? "checked" : ""}> Show lost</label></div>
    <div class="board">${stages.map((s) => {
      const items = deals.filter((d) => d.stage === s).sort((a, b) => (a.closeDate || "9").localeCompare(b.closeDate || "9"));

      return `<section class="colm" data-stage="${esc(s)}"><header><b>${esc(s)}</b><small>${items.length}${total ? " · " + short$(total) : ""}</small></header>
        ${items.map((d) => { const c = contactById(d.contactId); const st = cfg().DEAL_TYPES[d.type].stages; return `<article class="dcard" draggable="true" data-id="${d.id}">

          <div class="ft"><select class="select-inline" style="max-width:100%" data-change="stage" data-id="${d.id}" aria-label="Stage for ${esc(c ? c.name : "deal")}">${st.map((x) => `<option${x === d.stage ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>${isManager() ? `<span class="av" style="width:28px;height:28px;font-size:11.5px" title="${esc(userName(d.agentId || d.loId))}">${esc(initials(userName(d.agentId || d.loId, "?")))}</span>` : ""}</div>
        </article>`; }).join("")}</section>`;
    }).join("")}</div>`;
}
function wireBoard() {
  let dragId = null;
  document.querySelectorAll(".dcard").forEach((el) => {
    el.addEventListener("dragstart", (e) => { dragId = el.dataset.id; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); });
  });
  document.querySelectorAll(".colm").forEach((col) => {
    col.addEventListener("dragover", (e) => { if (dragId) { e.preventDefault(); col.classList.add("drop"); } });
    col.addEventListener("dragleave", () => col.classList.remove("drop"));
    col.addEventListener("drop", (e) => { e.preventDefault(); col.classList.remove("drop"); const id = dragId; dragId = null; if (id) moveStage(id, col.dataset.stage); });
  });
}
async function moveStage(id, stage) {
  const d = D().deals.find((x) => x.id === id); if (!d || d.stage === stage) return;
  try { await api("deal.save", { id, stage }); render(); toast(`Moved to ${stage}`); } catch (e) { toast(e.message, "err"); render(); }
}

const userOpts = () => activeUsers().map((u) => [u.id, u.name + (u.title ? " · " + u.title : "")]);
function formData(form) {
  const o = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === "checkbox") { if (el.dataset.multi) { (o[el.name] ||= []); if (el.checked) o[el.name].push(el.value); } else o[el.name] = el.checked; }
    else if (el.type === "radio") { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value;
  }
  return o;
}

      if (!f.contactId) throw new Error("Choose which contact this deal is for.");
      const r = await api("deal.save", { ...f, id: d.id });
      closeSheet(); render(); toast(d.id ? "Deal saved" : "Deal added");
      return r;
    });
  const form = $("#sheetForm"), loan = () => { const t = form.type.value; $("#loanFields").style.display = cfg().DEAL_TYPES[t].group === "Mortgage" || t === "Buy" ? "" : "none"; };
  form.type.addEventListener("change", () => { $("#stageWrap").innerHTML = sel("stage", stagesFor(form.type.value), ""); loan(); });
  loan();
}
function taskForm(t, contactId) {
  t = t || { kind: "Call", due: inDays(1, 10), assignedTo: me().id };
  const cid = t.contactId || contactId;
  const contacts = D().contacts.filter((c) => !c.pool).sort((a, b) => a.name.localeCompare(b.name));
  const c = cid ? contactById(cid) : null;
  openSheet(t.id ? "Edit follow-up" : "New follow-up", `
    ${cid ? `<input type="hidden" name="contactId" value="${esc(cid)}"><p style="margin:0">With <b>${esc(c?.name || "")}</b></p>` : `<label class="f">Contact <small>(optional)</small>${sel("contactId", contacts.map((x) => [x.id, x.name]), "", "No contact")}</label>`}
    <div class="chips" role="radiogroup" aria-label="Type">${cfg().TASK_KINDS.map((k) => `<label><input type="radio" name="kind" value="${k}" ${k === t.kind ? "checked" : ""}><span>${k}</span></label>`).join("")}</div>
    <label class="f">What to do<input type="text" name="title" value="${esc(t.title || (c ? "Call " + c.name.split(" ")[0] : ""))}" required></label>
    <label class="f">When<input type="datetime-local" name="due" value="${esc(toLocalInput(t.due))}" required></label>
    <div class="chips">${[["Later today", 0, new Date().getHours() + 2], ["Tomorrow", 1, 10], ["In 3 days", 3, 10], ["Next week", 7, 10], ["In a month", 30, 10]].map(([l, n, h]) => `<button type="button" class="btn ghost sm" data-act="due" data-days="${n}" data-hour="${Math.min(h, 20)}">${l}</button>`).join("")}</div>
    ${isManager() ? `<label class="f">Assigned to${sel("assignedTo", userOpts(), t.assignedTo || me().id)}</label>` : ""}
    <label class="f">Details <small>(optional)</small><textarea name="details">${esc(t.details || "")}</textarea></label>`,
    t.id ? `<button type="button" class="btn danger left" data-act="del-task" data-id="${t.id}">Delete</button><button type="button" class="btn ghost" data-act="close-sheet">Cancel</button><button class="btn" type="submit">Save</button>` : null,
    async (f) => {
      if (!f.due) throw new Error("Pick when this follow-up is due.");
      await api("task.save", { ...f, id: t.id, due: new Date(f.due).toISOString() });
      closeSheet(); render(); toast("Follow-up saved");
    });
}
function userForm(u) {
  u = u || { role: "agent", title: "Agent", active: true, canClaim: false, canSeeAll: false };
  const self = u.id === me().id;
  openSheet(u.id ? "Edit " + u.name : "Add a person", `
    <div class="grid2"><label class="f">Full name<input type="text" name="name" value="${esc(u.name || "")}" required></label><label class="f">Title${sel("title", cfg().TITLES, u.title)}</label></div>
    <div class="grid2"><label class="f">Email<input type="email" name="email" value="${esc(u.email || "")}"></label><label class="f">Phone<input type="tel" name="phone" value="${esc(u.phone || "")}"></label></div>
    <label class="f">Username <small>Letters, numbers, dots, dashes</small><input type="text" name="username" value="${esc(u.username || "")}" autocapitalize="none" spellcheck="false" autocomplete="off" required></label>
    <label class="f">${u.id ? "Reset password <small>Leave blank to keep their current password</small>" : "Starting password <small>At least 10 characters. They'll choose their own when they first sign in.</small>"}<input type="text" name="password" autocomplete="off" spellcheck="false" ${u.id ? "" : "required"} placeholder="${u.id ? "New starting password" : ""}"></label>
    ${self ? `<input type="hidden" name="role" value="broker">` : `<label class="f">Access${sel("role", [["agent", "Agent (sees only their own contacts)"], ["broker", "Broker (sees and manages everything)"]], u.role)}</label>`}
    <div id="agentPerms" style="display:grid;gap:10px">
      <label class="chk"><input type="checkbox" name="canClaim" ${u.canClaim ? "checked" : ""}> Lead pool: can see unassigned website leads and take them</label>
      <label class="chk"><input type="checkbox" name="canSeeAll" ${u.canSeeAll ? "checked" : ""}> Manager: can see and assign all contacts (not logins)</label>
    </div>
    <label class="chk"><input type="checkbox" name="digest" ${u.digest !== false ? "checked" : ""}> Morning email: today's follow-ups, new leads, closings, and rate locks (sent to the email above around 6–7 AM)</label>
    <label class="f">Website profile <small>(optional) Leads from this person's listing pages go straight to them</small>${sel("slug", (window.__TEAM || []).map((m) => [m.slug, m.name]), u.slug, "None")}</label>
    ${u.id && !self ? `<label class="chk"><input type="checkbox" name="active" ${u.active ? "checked" : ""}> Can sign in (uncheck to turn off this login; their contacts stay in the CRM)</label>` : `<input type="hidden" name="active" value="on">`}`,
    null,
    async (f) => {
      f.active = f.active === "on" || f.active === true;
      await api("user.save", { ...f, id: u.id });
      closeSheet(); render(); toast(u.id ? "Saved" : "Login created. Share the username and starting password with them privately.");
    });
  const form = $("#sheetForm"), perms = () => { if (form.role) $("#agentPerms").style.display = form.role.value === "broker" ? "none" : "grid"; };
  if (form.role && form.role.tagName === "SELECT") form.role.addEventListener("change", perms);
  perms();
}
function addMenu() {
  openSheet("Add", `<div class="menu">
    <button type="button" data-act="new-contact">${ico("people")} New contact or lead</button>
    <button type="button" data-act="new-task">${ico("check")} New follow-up</button>
    <button type="button" data-act="new-deal">${ico("dollar")} New deal (buy, sell, loan, refi)</button></div>`, `<button type="button" class="btn ghost" data-act="close-sheet">Close</button>`);
}

// ---------- CSV export (broker) ----------
function exportCsv() {
  const cols = ["name", "phone", "email", "address", "city", "types", "status", "temp", "source", "sourceDetail", "agent", "loanOfficer", "tags", "createdAt"];
  const rows = D().contacts.filter((c) => !c.pool).map((c) => ({ ...c, types: (c.types || []).join("; "), agent: userName(c.assignedTo, ""), loanOfficer: userName(c.lo, "") }));
  const q = (v) => { let s = String(v ?? ""); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = [cols.join(","), ...rows.map((r) => cols.map((k) => q(r[k])).join(","))].join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `pandey-crm-contacts-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ---------- events ----------
async function guarded(btn, fn) {
  if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { const m = $("#sheetMsg"); if (S.sheet && m) { m.textContent = e.message; m.hidden = false; m.scrollIntoView({ block: "nearest" }); } else toast(e.message, "err"); }
  finally { if (btn && document.contains(btn)) btn.disabled = false; }
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "close-sheet") { if (el.classList.contains("scrim") && e.target !== el) return; e.preventDefault(); return closeSheet(); }
  const wasSheet = !!S.sheet;
  const fromMenu = wasSheet && el.closest(".menu");
  if (fromMenu) closeSheet();
  switch (act) {
    case "showpw": { const i = el.previousElementSibling; i.type = i.type === "password" ? "text" : "password"; el.textContent = i.type === "password" ? "Show" : "Hide"; return; }
    case "add": return addMenu();
    case "search": e.preventDefault(); S.qFocus = true; if (location.hash !== "#contacts") location.hash = "#contacts"; else render(); return;
    case "filter-new": S.status = "New"; S.q = ""; return;
    case "clear-filters": S.status = S.type = S.q = ""; S.owner = "all"; return render();
    case "new-contact": return contactForm();
    case "edit-contact": return contactForm(contactById(id));
    case "new-deal": return dealForm(null, el.dataset.contact || (route().view === "contact" ? route().arg : ""));
    case "edit-deal": return dealForm(D().deals.find((d) => d.id === id));
    case "new-task": return taskForm(null, el.dataset.contact || (route().view === "contact" ? route().arg : ""));
    case "edit-task": return taskForm(D().tasks.find((t) => t.id === id));
    case "new-user": return userForm();
    case "edit-user": return userForm(userById(id));
    case "ttab": S.ttab = el.dataset.v; return render();
    case "export": return exportCsv();
    case "due": { const d = new Date(); d.setDate(d.getDate() + Number(el.dataset.days)); d.setHours(Number(el.dataset.hour), 0, 0, 0); $("#sheetForm").due.value = toLocalInput(d.toISOString()); return; }
    case "claim": return guarded(el, async () => { await api("contact.claim", { id }); location.hash = "#contact/" + id; render(); toast("It's yours. Reach out soon!"); });
    case "logout": return guarded(el, async () => { await api("logout"); S.data = null; S.authed = false; closeSheet(); location.hash = ""; render(); });
    case "del-contact": if (!confirm("Delete this contact and all of their deals, follow-ups, and notes? This can't be undone.")) return; return guarded(el, async () => { await api("contact.delete", { id }); closeSheet(); location.hash = "#contacts"; render(); toast("Contact deleted"); });
    case "del-deal": if (!confirm("Delete this deal?")) return; return guarded(el, async () => { await api("deal.delete", { id }); closeSheet(); render(); toast("Deal deleted"); });
    case "del-task": if (!confirm("Delete this follow-up?")) return; return guarded(el, async () => { await api("task.delete", { id }); closeSheet(); render(); toast("Deleted"); });
    case "del-note": if (!confirm("Delete this note?")) return; return guarded(el, async () => { await api("note.delete", { id }); render(); });
  }
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-change]"); if (!el) return;
  const k = el.dataset.change, id = el.dataset.id;
  if (["owner", "towner", "status", "type", "sort"].includes(k)) { S[k] = el.value; return render(); }
  if (k === "showLost") { S.showLost = el.checked; return render(); }
  if (k === "stage") return moveStage(id, el.value);
  if (k === "assign") return guarded(el, async () => { const c = contactById(id); await api("contact.save", { ...c, assignedTo: el.value }); render(); toast(el.value ? "Assigned to " + userName(el.value) : "Moved to the lead pool"); });
  if (k === "task-done") return guarded(el, async () => { await api("task.done", { id, done: el.checked }); render(); if (el.checked) toast("Done ✓"); });
});
let qTimer;
document.addEventListener("input", (e) => {
  if (e.target.dataset.input === "q") { S.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(() => { S.qFocus = true; render(); }, 180); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) closeSheet(); });
document.addEventListener("submit", (e) => {
  const f = e.target; e.preventDefault();
  const btn = f.querySelector('[type=submit]');
  if (f.id === "loginForm") return guarded(btn, async () => {
    try { await api("login", formData(f)); await load(); }
    catch (err) { $("#app").innerHTML = loginView(err.message); $("#loginForm").username.value = f.username.value; $("#loginForm").password.focus(); }
  });
  if (f.id === "pwForm") return guarded(btn, async () => {
    const v = formData(f), m = $("#pwMsg");
    const say = (t, k) => { m.textContent = t; m.className = "msg " + k; m.hidden = false; };
    if (v.next !== v.again) return say("The two new passwords don't match.", "err");
    try { await api("account.password", { current: v.current, next: v.next }); f.reset(); render(); toast("Password updated"); }
    catch (err) { say(err.message, "err"); }
  });
  if (f.id === "logForm") return guarded(btn, async () => {
    const v = formData(f), cid = f.dataset.contact;
    await api("note.add", { contactId: cid, kind: v.kind, text: v.text });
    if (v.next) { const c = contactById(cid); await api("task.save", { contactId: cid, kind: v.kind === "Note" ? "Call" : v.kind, title: `Follow up with ${c.name.split(" ")[0]}`, due: inDays(Number(v.next), 10), details: v.text.slice(0, 300) }); }
    render(); toast(v.next ? "Saved, and follow-up scheduled" : "Saved");
  });
  if (f.id === "sheetForm" && S.sheet?.onSubmit) {
    const req = [...f.querySelectorAll("[required]")].find((x) => !x.value.trim());
    if (req) { const m = $("#sheetMsg"); m.textContent = "Please fill in: " + (req.closest("label")?.childNodes[0]?.textContent || "required fields").trim(); m.hidden = false; req.focus(); return; }
    return guarded(btn, () => S.sheet.onSubmit(formData(f)));
  }
});

load();
})();
</script>
